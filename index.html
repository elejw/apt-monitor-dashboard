<title>실거래 모니터링</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --surface-2:      #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);

    --series-1: #2a78d6; /* 서초구 */
    --series-2: #eb6834; /* 성동구 */
    --series-3: #1baf7a; /* 용산구 */

    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-critical: #d03b3b;
    --status-muted:    #898781;

    --status-good-bg:     rgba(12,163,12,0.10);
    --status-warning-bg:  rgba(250,178,25,0.14);
    --status-critical-bg: rgba(208,59,59,0.10);
    --status-muted-bg:    rgba(137,135,129,0.12);

    --accent-bg: rgba(42,120,214,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --surface-2:      #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);

      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;

      --status-good:     #0ca30c;
      --status-warning:  #fab219;
      --status-critical: #e66767;
      --status-muted:    #898781;

      --status-good-bg:     rgba(12,163,12,0.16);
      --status-warning-bg:  rgba(250,178,25,0.16);
      --status-critical-bg: rgba(230,103,103,0.16);
      --status-muted-bg:    rgba(137,135,129,0.16);

      --accent-bg: rgba(57,135,229,0.16);
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);

    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;

    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-critical: #e66767;
    --status-muted:    #898781;

    --status-good-bg:     rgba(12,163,12,0.16);
    --status-warning-bg:  rgba(250,178,25,0.16);
    --status-critical-bg: rgba(230,103,103,0.16);
    --status-muted-bg:    rgba(137,135,129,0.16);

    --accent-bg: rgba(57,135,229,0.16);
  }

  * { box-sizing: border-box; }
  body { background: var(--surface-2); }
  .viz-root {
    background: var(--surface-2);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 2px; }
  .subhead { color: var(--text-secondary); font-size: 13px; margin: 0 0 4px; }
  .subhead b { color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .updated { color: var(--text-muted); font-size: 11px; margin: 0 0 24px; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 14px; font-weight: 700; margin: 0 0 2px; }
  .card .desc { font-size: 12px; color: var(--text-muted); margin: 0 0 16px; }

  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 14px 12px;
  }
  .tile .n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tile .lbl { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.good { background: var(--status-good); }
  .dot.warning { background: var(--status-warning); }
  .dot.critical { background: var(--status-critical); }
  .dot.muted { background: var(--status-muted); }
  .dot.total { background: var(--text-primary); }

  .chart-wrap { position: relative; }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .axis-label { fill: var(--text-muted); font-size: 10px; }
  .row-label { fill: var(--text-secondary); font-size: 11px; }
  .row-label.sub { fill: var(--text-muted); font-size: 10px; }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; stroke-dasharray: 2 3; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .legend-chip { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend-line { width: 14px; height: 2px; border-radius: 1px; flex: none; }

  .tooltip {
    position: absolute; pointer-events: none; z-index: 5;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; color: var(--text-primary);
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    max-width: 240px; line-height: 1.5; opacity: 0; transition: opacity .08s;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .t-title { font-weight: 700; margin-bottom: 2px; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 14px; color: var(--text-secondary); }
  .tooltip .t-row b { color: var(--text-primary); font-variant-numeric: tabular-nums; }

  .dot-mark { cursor: pointer; }

  .anomaly-card {
    border: 1px solid var(--border); border-radius: 10px; padding: 16px;
    margin-bottom: 12px; background: var(--surface-1);
  }
  .anomaly-card:last-child { margin-bottom: 0; }
  .a-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .a-title { font-size: 14px; font-weight: 700; }
  .a-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .a-stats { display: flex; gap: 18px; margin: 12px 0; flex-wrap: wrap; }
  .a-stat { font-size: 12px; color: var(--text-muted); }
  .a-stat b { display: block; font-size: 14px; color: var(--text-primary); font-variant-numeric: tabular-nums; margin-top: 1px; }
  .a-stat b.neg { color: var(--status-critical); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
    background: var(--status-critical-bg); color: var(--text-primary); border: 1px solid var(--border);
  }
  .badge.conf-low { opacity: 0.7; }
  .a-reason { font-size: 13px; color: var(--text-secondary); line-height: 1.65; margin: 12px 0 10px; }
  .a-action { font-size: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .a-action b { color: var(--text-primary); }

  details.tbl summary { cursor: pointer; font-size: 13px; font-weight: 600; padding: 4px 0; color: var(--text-secondary); }
  table.data { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  table.data th { text-align: left; color: var(--text-muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--gridline); white-space: nowrap; }
  table.data td { padding: 6px 8px; border-bottom: 1px solid var(--gridline); color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.data td.name { color: var(--text-primary); font-variant-numeric: initial; white-space: normal; }
  table.data tr:last-child td { border-bottom: none; }

  /* combobox */
  .combo { position: relative; max-width: 420px; }
  .combo input {
    width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-primary); font-size: 13px; font-family: inherit;
  }
  .combo input:focus { outline: 2px solid var(--series-1); outline-offset: -1px; }
  .combo-list {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; max-height: 280px; overflow-y: auto;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 10; display: none;
  }
  .combo-list.open { display: block; }
  .combo-opt { padding: 8px 12px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .combo-opt:hover, .combo-opt.hi { background: var(--accent-bg); }
  .combo-opt .gu { color: var(--text-muted); font-size: 11px; }
  .combo-empty { padding: 10px 12px; font-size: 12px; color: var(--text-muted); }

  .area-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
  .area-tab {
    padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2);
    font-size: 12px; color: var(--text-secondary); cursor: pointer;
  }
  .area-tab.active { background: var(--series-1); border-color: var(--series-1); color: #fff; }

  .complex-meta { display: flex; gap: 20px; flex-wrap: wrap; margin: 4px 0 16px; }
  .complex-meta .m { font-size: 12px; color: var(--text-muted); }
  .complex-meta .m b { display: block; font-size: 14px; color: var(--text-primary); font-variant-numeric: tabular-nums; }

  .empty-state { color: var(--text-muted); font-size: 13px; padding: 30px 0; text-align: center; }

  @media (max-width: 640px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
  }
</style>

      <div class="lbl"><span class="dot ${STATUS_CLASS[t.key] || 'total'}"></span>${t.label}</div>
    </div>`).join('');

  // ---------- tooltip helper ----------
  function makeTooltip(container) {
    const el = document.createElement('div');
    el.className = 'tooltip';
    container.appendChild(el);
    return {
      show(html, x, y) {
        el.innerHTML = html;
        el.classList.add('show');
        const cw = container.clientWidth;
        let left = x + 14;
        if (left + 220 > cw) left = x - 234;
        el.style.left = left + 'px';
        el.style.top = Math.max(0, y - 10) + 'px';
      },
      hide() { el.classList.remove('show'); },
    };
  }

  const svgNS = 'http://www.w3.org/2000/svg';
  function sel(tag, attrs) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // ============================================================
  // Chart 1 — deviation dot plot (watch + anomaly)
  // ============================================================
  (function devChart() {
    const rows = DATA.predictions
      .filter(p => p.status === 'watch' || p.status === 'anomaly')
      .sort((a, b) => {
        const rank = { anomaly: 0, watch: 1 };
        if (rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
        return Math.abs(b.error) - Math.abs(a.error);
      });

    document.getElementById('devLegend').innerHTML = `
      <div class="legend-item"><span class="legend-chip" style="background:${tok('--status-critical')}"></span>이상 (|오차| ≥ 15%)</div>
      <div class="legend-item"><span class="legend-chip" style="background:${tok('--status-warning')}"></span>관찰 (|오차| ≥ 8%)</div>`;

    if (!rows.length) {
      document.getElementById('devChartWrap').innerHTML = '<div class="empty-state">이번 갱신에서는 관찰·이상 거래가 없었습니다.</div>';
      return;
    }

    const rowH = 26, padTop = 10, padBottom = 30, padLeft = 190, padRight = 30;
    const width = 900, height = rows.length * rowH + padTop + padBottom;
    const plotW = width - padLeft - padRight;

    const maxAbs = Math.max(0.20, ...rows.map(r => Math.abs(r.error))) * 1.08;
    const xScale = (v) => padLeft + (v + maxAbs) / (2 * maxAbs) * plotW;

    const svg = sel('svg', { viewBox: `0 0 ${width} ${height}`, width: '100%', height, style: 'display:block;overflow:visible' });

    [
      { from: 0.08, to: 0.15, color: 'var(--status-warning-bg)' },
      { from: -0.15, to: -0.08, color: 'var(--status-warning-bg)' },
      { from: 0.15, to: maxAbs, color: 'var(--status-critical-bg)' },
      { from: -maxAbs, to: -0.15, color: 'var(--status-critical-bg)' },
    ].forEach(b => {
      svg.appendChild(sel('rect', {
        x: xScale(b.from), y: padTop, width: Math.max(0, xScale(b.to) - xScale(b.from)),
        height: rows.length * rowH, fill: b.color,
      }));
    });

    [-0.20, -0.10, 0, 0.10, 0.20].forEach(t => {
      if (t > maxAbs || t < -maxAbs) return;
      const x = xScale(t);
      svg.appendChild(sel('line', { x1: x, x2: x, y1: padTop, y2: padTop + rows.length * rowH, class: t === 0 ? 'baseline' : 'gridline' }));
      const lab = sel('text', { x: x, y: padTop + rows.length * rowH + 18, class: 'axis-label', 'text-anchor': 'middle' });
      lab.textContent = (t > 0 ? '+' : '') + Math.round(t * 100) + '%';
      svg.appendChild(lab);
    });

    const tt = makeTooltip(document.getElementById('devChartWrap'));

    rows.forEach((r, i) => {
      const y = padTop + i * rowH + rowH / 2;
      const statusColor = tok('--status-' + STATUS_CLASS[r.status]);

      const label = sel('text', { x: padLeft - 12, y: y - 3, class: 'row-label', 'text-anchor': 'end' });
      label.textContent = (r.apt_name.length > 12 ? r.apt_name.slice(0, 12) + '…' : r.apt_name) + ' ' + r.area.toFixed(0) + '㎡';
      svg.appendChild(label);
      const sub = sel('text', { x: padLeft - 12, y: y + 9, class: 'row-label sub', 'text-anchor': 'end' });
      sub.textContent = r.district_name + ' · ' + r.deal_date;
      svg.appendChild(sub);

      const x0 = xScale(0), x1 = xScale(r.error);
      svg.appendChild(sel('line', { x1: x0, x2: x1, y1: y, y2: y, stroke: statusColor, 'stroke-width': 2, opacity: 0.55 }));

      const dot = sel('circle', { cx: x1, cy: y, r: 5, fill: statusColor, stroke: tok('--surface-1'), 'stroke-width': 2, class: 'dot-mark' });
      dot.addEventListener('mouseenter', (ev) => {
        const rect = document.getElementById('devChartWrap').getBoundingClientRect();
        const px = (ev.clientX - rect.left), py = (ev.clientY - rect.top);
        tt.show(`
          <div class="t-title">${esc(r.apt_name)} ${r.area.toFixed(1)}㎡</div>
          <div class="t-row"><span>${esc(r.dong)} · ${r.floor}층</span></div>
          <div class="t-row"><span>거래일</span><b>${r.deal_date}</b></div>
          <div class="t-row"><span>신고가</span><b>${fmtEok(r.price)}</b></div>
          <div class="t-row"><span>예측</span><b>${fmtEok(r.predicted)}</b></div>
          <div class="t-row"><span>오차</span><b>${fmtPct(r.error)}</b></div>
          ${r.diagnosis ? `<div class="t-row"><span>진단</span><b>${VERDICT_LABEL[r.diagnosis.verdict] || r.diagnosis.verdict}</b></div>` : ''}
        `, px, py);
      });
      dot.addEventListener('mousemove', (ev) => {
        const rect = document.getElementById('devChartWrap').getBoundingClientRect();
        tt.show(tt._lastHtml, ev.clientX - rect.left, ev.clientY - rect.top);
      });
      dot.addEventListener('mouseleave', () => tt.hide());
      svg.appendChild(dot);
    });

    document.getElementById('devChartWrap').appendChild(svg);
  })();

  // ============================================================
  // Chart 2 — district trend line
  // ============================================================
  (function trendChart() {
    const districts = ['서초구', '성동구', '용산구'];
    const months = [...new Set(DATA.trend.map(d => d.ym))].sort();
    const byDistrict = {};
    districts.forEach(d => byDistrict[d] = {});
    DATA.trend.forEach(d => { byDistrict[d.district][d.ym] = d.median_unit_price * 10000; });

    document.getElementById('trendLegend').innerHTML = districts.map(d => `
      <div class="legend-item"><span class="legend-line" style="background:${DISTRICT_COLOR[d]}"></span>${d}</div>`).join('');

    const padTop = 16, padBottom = 30, padLeft = 56, padRight = 20;
    const width = 900, height = 260;
    const plotW = width - padLeft - padRight, plotH = height - padTop - padBottom;

    const allVals = districts.flatMap(d => months.map(m => byDistrict[d][m]).filter(v => v != null));
    const yMin = Math.min(...allVals) * 0.92, yMax = Math.max(...allVals) * 1.05;
    const xScale = (i) => padLeft + (i / (months.length - 1)) * plotW;
    const yScale = (v) => padTop + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

    const svg = sel('svg', { viewBox: `0 0 ${width} ${height}`, width: '100%', height, style: 'display:block;overflow:visible' });

    const yTicks = 4;
    for (let i = 0; i <= yTicks; i++) {
      const v = yMin + (yMax - yMin) * (i / yTicks);
      const y = yScale(v);
      svg.appendChild(sel('line', { x1: padLeft, x2: width - padRight, y1: y, y2: y, class: 'gridline' }));
      const lab = sel('text', { x: padLeft - 8, y: y + 3, class: 'axis-label', 'text-anchor': 'end' });
      lab.textContent = Math.round(v).toLocaleString();
      svg.appendChild(lab);
    }
    months.forEach((m, i) => {
      if (i % 2 !== 0 && i !== months.length - 1) return;
      const lab = sel('text', { x: xScale(i), y: height - padBottom + 16, class: 'axis-label', 'text-anchor': 'middle' });
      lab.textContent = m.slice(2).replace('-', '.');
      svg.appendChild(lab);
    });

    const crosshair = sel('line', { x1: 0, x2: 0, y1: padTop, y2: padTop + plotH, class: 'gridline', style: 'display:none' });
    svg.appendChild(crosshair);

    districts.forEach(d => {
      const pts = months.map((m, i) => byDistrict[d][m] != null ? [xScale(i), yScale(byDistrict[d][m])] : null).filter(Boolean);
      const path = sel('path', {
        d: pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ' ' + p[1]).join(' '),
        fill: 'none', stroke: DISTRICT_COLOR[d], 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      });
      svg.appendChild(path);
      pts.forEach(p => svg.appendChild(sel('circle', { cx: p[0], cy: p[1], r: 3.5, fill: DISTRICT_COLOR[d], stroke: tok('--surface-1'), 'stroke-width': 1.5 })));
    });

    const hit = sel('rect', { x: padLeft, y: padTop, width: plotW, height: plotH, fill: 'transparent', style: 'cursor:crosshair' });
    const tt = makeTooltip(document.getElementById('trendChartWrap'));
    hit.addEventListener('mousemove', (ev) => {
      const wrapRect = document.getElementById('trendChartWrap').getBoundingClientRect();
      const svgRect = svg.getBoundingClientRect();
      const scaleX = width / svgRect.width;
      const localX = (ev.clientX - svgRect.left) * scaleX;
      let idx = Math.round((localX - padLeft) / plotW * (months.length - 1));
      idx = Math.max(0, Math.min(months.length - 1, idx));
      const m = months[idx];
      crosshair.setAttribute('x1', xScale(idx));
      crosshair.setAttribute('x2', xScale(idx));
      crosshair.style.display = '';
      const html = `<div class="t-title">${m}</div>` + districts.map(d => {
        const v = byDistrict[d][m];
        return `<div class="t-row"><span><span class="legend-chip" style="background:${DISTRICT_COLOR[d]};display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px"></span>${d}</span><b>${v != null ? Math.round(v).toLocaleString() + '만원/㎡' : '-'}</b></div>`;
      }).join('');
      tt.show(html, ev.clientX - wrapRect.left, ev.clientY - wrapRect.top);
    });
    hit.addEventListener('mouseleave', () => { tt.hide(); crosshair.style.display = 'none'; });
    svg.appendChild(hit);

    document.getElementById('trendChartWrap').appendChild(svg);
  })();

  // ============================================================
  // Chart 3 — complex picker + per-node history/forecast
  // ============================================================
  (function complexPicker() {
    const input = document.getElementById('complexInput');
    const list = document.getElementById('complexList');
    const detail = document.getElementById('complexDetail');
    let activeIdx = -1;
    let filtered = [];

    function renderOptions(query) {
      const q = query.trim().toLowerCase();
      filtered = !q ? [] : COMPLEXES.filter(c => c.apt_name.toLowerCase().includes(q) || c.dong.includes(q)).slice(0, 30);
      if (!filtered.length) {
        list.innerHTML = q ? `<div class="combo-empty">'${esc(query)}' 검색 결과 없음</div>` : '';
        list.classList.toggle('open', !!q);
        return;
      }
      list.innerHTML = filtered.map((c, i) => `
        <div class="combo-opt${i === activeIdx ? ' hi' : ''}" data-idx="${i}">
          <span>${esc(c.apt_name)}</span><span class="gu">${esc(c.gu)} ${esc(c.dong)}</span>
        </div>`).join('');
      list.classList.add('open');
    }

    input.addEventListener('input', () => { activeIdx = -1; renderOptions(input.value); });
    input.addEventListener('focus', () => { if (input.value) renderOptions(input.value); });
    input.addEventListener('keydown', (ev) => {
      if (!filtered.length) return;
      if (ev.key === 'ArrowDown') { ev.preventDefault(); activeIdx = Math.min(filtered.length - 1, activeIdx + 1); renderOptions(input.value); }
      else if (ev.key === 'ArrowUp') { ev.preventDefault(); activeIdx = Math.max(0, activeIdx - 1); renderOptions(input.value); }
      else if (ev.key === 'Enter') { ev.preventDefault(); if (activeIdx >= 0) selectComplex(filtered[activeIdx]); }
      else if (ev.key === 'Escape') { list.classList.remove('open'); }
    });
    list.addEventListener('click', (ev) => {
      const opt = ev.target.closest('.combo-opt');
      if (!opt) return;
      selectComplex(filtered[+opt.dataset.idx]);
    });
    document.addEventListener('click', (ev) => {
      if (!document.getElementById('complexCombo').contains(ev.target)) list.classList.remove('open');
    });

    function selectComplex(c) {
      input.value = c.apt_name;
      list.classList.remove('open');
      renderComplex(c, c.nodes[0]);
    }

    function renderComplex(c, node) {
      const relatedDeals = DATA.predictions.filter(p => p.apt_name === c.apt_name);

      let html = `
        <div class="complex-meta">
          <div class="m">구/동<b>${esc(c.gu)} ${esc(c.dong)}</b></div>
          <div class="m">준공연도<b>${c.build_year}</b></div>
          <div class="m">세대수<b>${c.households.toLocaleString()}</b></div>
          <div class="m">전용면적 타입<b>${c.nodes.length}종</b></div>
        </div>`;

      if (c.nodes.length > 1) {
        html += `<div class="area-tabs">` + c.nodes.map((n, i) => `
          <div class="area-tab${n === node ? ' active' : ''}" data-i="${i}">${n.area.toFixed(0)}㎡ (${n.n_tx}건)</div>`).join('') + `</div>`;
      }

      html += `<div class="chart-wrap" id="nodeChartWrap"></div>
        <div class="complex-meta" id="nodeStats" style="margin-top:14px"></div>`;

      if (relatedDeals.length) {
        html += `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
          <div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:8px">이번 갱신에서 평가된 거래</div>
          ${relatedDeals.map(r => `
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px solid var(--gridline)">
              <span><span class="dot ${STATUS_CLASS[r.status]}" style="display:inline-block;margin-right:5px"></span>${r.area.toFixed(0)}㎡ · ${r.deal_date} · ${fmtEok(r.price)}</span>
              <span style="color:var(--text-muted)">${STATUS_LABEL[r.status]}${r.error != null ? ' · 오차 ' + fmtPct(r.error) : ''}</span>
            </div>`).join('')}
        </div>`;
      }

      detail.innerHTML = html;

      if (c.nodes.length > 1) {
        detail.querySelectorAll('.area-tab').forEach(tab => {
          tab.addEventListener('click', () => renderComplex(c, c.nodes[+tab.dataset.i]));
        });
      }

      renderNodeChart(c, node);
    }

    function renderNodeChart(c, node) {
      const wrap = document.getElementById('nodeChartWrap');
      const statsEl = document.getElementById('nodeStats');
      const txs = node.txs;

      const t = node.trend;
      statsEl.innerHTML = `
        <div class="m">거래 표본<b>${node.n_tx}건</b></div>
        <div class="m">추정 연율<b>${t ? fmtPct(t.ann_rate) : '-'}</b></div>
        <div class="m">적합도(R²)<b>${t && t.r2 != null ? t.r2.toFixed(2) : '-'}</b></div>
      `;

      if (txs.length < 2) {
        wrap.innerHTML = '<div class="empty-state">거래 이력이 1건뿐이라 추세를 그릴 수 없습니다.</div>';
        return;
      }

      const parseDate = (s) => new Date(s + 'T00:00:00Z').getTime();
      const t0 = parseDate(txs[0].date);
      const dayMs = 86400000;
      const toYears = (ms) => (ms - t0) / dayMs / 365;

      const lastT = toYears(parseDate(txs[txs.length - 1].date));
      const forecastEndT = lastT + 0.5;

      let fitPts = null;
      if (t) {
        const lastAdj = txs[txs.length - 1].adj;
        fitPts = [];
        const steps = 20;
        for (let i = 0; i <= steps; i++) {
          const yrs = (i / steps) * forecastEndT;
          fitPts.push([yrs, lastAdj * Math.pow(1 + t.ann_rate, yrs - lastT)]);
        }
      }

      const padTop = 16, padBottom = 34, padLeft = 60, padRight = 20;
      const width = 900, height = 260;
      const plotW = width - padLeft - padRight, plotH = height - padTop - padBottom;

      const allY = txs.map(x => x.adj).concat(fitPts ? fitPts.map(p => p[1]) : []);
      const yMin = Math.min(...allY) * 0.9, yMax = Math.max(...allY) * 1.08;
      const xMax = forecastEndT;
      const xScale = (yrs) => padLeft + (yrs / xMax) * plotW;
      const yScale = (v) => padTop + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

      const svg = sel('svg', { viewBox: `0 0 ${width} ${height}`, width: '100%', height, style: 'display:block;overflow:visible' });

      const yTicks = 4;
      for (let i = 0; i <= yTicks; i++) {
        const v = yMin + (yMax - yMin) * (i / yTicks);
        const y = yScale(v);
        svg.appendChild(sel('line', { x1: padLeft, x2: width - padRight, y1: y, y2: y, class: 'gridline' }));
        const lab = sel('text', { x: padLeft - 8, y: y + 3, class: 'axis-label', 'text-anchor': 'end' });
        lab.textContent = v.toFixed(1) + '억';
        svg.appendChild(lab);
      }

      // x-axis date ticks (first, mid, last observed, +forecast)
      const dateAt = (yrs) => new Date(t0 + yrs * 365 * dayMs);
      const xTickYrs = [0, lastT / 2, lastT, forecastEndT];
      xTickYrs.forEach((yrs, i) => {
        const x = xScale(yrs);
        const lab = sel('text', { x, y: height - padBottom + 16, class: 'axis-label', 'text-anchor': i === xTickYrs.length - 1 ? 'end' : (i === 0 ? 'start' : 'middle') });
        const d = dateAt(yrs);
        lab.textContent = `${d.getUTCFullYear()}.${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
        svg.appendChild(lab);
      });

      // forecast zone shading
      svg.appendChild(sel('rect', { x: xScale(lastT), y: padTop, width: xScale(forecastEndT) - xScale(lastT), height: plotH, fill: 'var(--accent-bg)' }));
      const fLab = sel('text', { x: xScale((lastT + forecastEndT) / 2), y: padTop + 12, class: 'axis-label', 'text-anchor': 'middle' });
      fLab.textContent = '예측 구간';
      svg.appendChild(fLab);

      // fit line
      if (fitPts) {
        const path = sel('path', {
          d: fitPts.map((p, i) => (i === 0 ? 'M' : 'L') + xScale(p[0]) + ' ' + yScale(p[1])).join(' '),
          fill: 'none', stroke: tok('--series-1'), 'stroke-width': 2, 'stroke-dasharray': '4 3', 'stroke-linecap': 'round',
        });
        svg.appendChild(path);
      }

      const tt = makeTooltip(wrap);

      // observed points (raw price shown in tooltip, adjusted price plotted)
      txs.forEach(tx => {
        const x = xScale(toYears(parseDate(tx.date)));
        const y = yScale(tx.adj);
        const dot = sel('circle', { cx: x, cy: y, r: 5, fill: tok('--series-1'), stroke: tok('--surface-1'), 'stroke-width': 2, class: 'dot-mark' });
        dot.addEventListener('mouseenter', (ev) => {
          const rect = wrap.getBoundingClientRect();
          tt.show(`
            <div class="t-title">${tx.date}</div>
            <div class="t-row"><span>신고가 (${tx.floor}층)</span><b>${tx.price.toFixed(2)}억</b></div>
            <div class="t-row"><span>층 보정가</span><b>${tx.adj.toFixed(2)}억</b></div>
          `, ev.clientX - rect.left, ev.clientY - rect.top);
        });
        dot.addEventListener('mouseleave', () => tt.hide());
        svg.appendChild(dot);
      });

      wrap.innerHTML = '';
      wrap.appendChild(svg);
    }
  })();

        <td>${fmtEok(r.predicted)}</td>
        <td>${fmtPct(r.error)}</td>
        <td>${esc(r.district_name)}</td>
      </tr>`).join('');
    document.getElementById('fullTable').innerHTML = head + '<tbody>' + body + '</tbody>';
  })();
})();
</script>
